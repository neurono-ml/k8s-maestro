name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'site-docs/**'
      - 'book.toml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup mdBook
        run: |
          wget https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdBook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz
          tar xvzf mdBook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz
          chmod +x mdbook

      - name: Build Book
        run: ./mdbook build

      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Deploy to gh-pages branch
        run: |
          # Remove any existing gh-pages branch
          git branch -D gh-pages || true
          git push origin --delete gh-pages || true
          
          # Create and switch to gh-pages branch
          git checkout --orphan gh-pages
          
          # Remove all files
          git rm -rf .
          
          # Copy the built book to the gh-pages branch
          cp -r book/* .
          
          # Add a .nojekyll file to prevent Jekyll processing
          touch .nojekyll
          
          # Explicitly remove any CNAME file to use default GitHub Pages URL
          rm -f CNAME
          
          # Commit and push
          git add .
          git commit -m "Deploy documentation to gh-pages"
          git push origin gh-pages --force